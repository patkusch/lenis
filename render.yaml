# Render Blueprint — deploys Lenis as a static site.
# In Render: New → Blueprint → connect this repo, or New → Static Site with the
# build command and publish path below.
services:
  - type: web
    name: lenis
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Single-page app: send unknown paths back to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
